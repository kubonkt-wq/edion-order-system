<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中日新聞専売店 EDION家電発注ポータル</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root { --edion-blue: #004098; --chunichi-blue: #0f2350; }
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navbar-brand-custom { background: linear-gradient(135deg, var(--chunichi-blue) 0%, var(--edion-blue) 100%); color: white !important; }
        .card-custom { border-radius: 8px; border: 1px solid #e3e6f0; box-shadow: 0 0.15rem 1.75rem 0 rgba(58,59,69,0.08); }
        .login-card { max-width: 450px; margin: 60px auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .section-header { background-color: #e9ecef; padding: 6px 12px; font-weight: bold; border-left: 4px solid var(--edion-blue); margin-bottom: 12px; }
    </style>
</head>
<body>

<div id="loginView" class="container">
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark">家電受発注ポータル</h4>
            <div class="text-muted small">中日新聞専売店 × EDION ESC提携</div>
            <div class="mt-2"><span class="badge bg-primary-subtle text-primary border">登録専売店: 1,163 店舗</span></div>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">ログインID</label>
                <input type="text" class="form-control" id="loginId" placeholder="管理者ID または 店舗コード" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">パスワード</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="パスワードを入力" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">ログイン</button>
        </form>
        <div class="bg-light p-3 rounded border">
            <div class="small fw-bold mb-2">テスト用クイック切替:</div>
            <button class="btn btn-outline-dark btn-sm w-100 mb-2" onclick="quickLogin('admin', 'admin123')">① 中日新聞社 本部管理者</button>
            <button class="btn btn-outline-primary btn-sm w-100" onclick="quickLogin('11114', 'shop123')">② 専売店: 内山</button>
        </div>
    </div>
</div>

<div id="portalView" style="display: none;">
    <nav class="navbar navbar-expand-lg navbar-brand-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">中日新聞専売店 家電受発注ポータル</a>
            <div class="d-flex text-white align-items-center">
                <span class="me-3 small" id="currentUserDisplay"></span>
                <button class="btn btn-sm btn-outline-light" onclick="logout()">ログアウト</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <ul class="nav nav-tabs mb-4" id="portalTab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#order-pane">新規入力・登録</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#list-pane">登録履歴・発注書出力</button></li>
            <li class="nav-item admin-only"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#master-pane">専売店マスタ (1,163店)</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="order-pane">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">家電発注登録フォーム</h5>
                    <form id="orderForm">
                        <div class="section-header">① 取扱専売店（中日新聞店）</div>
                        
                        <div class="bg-light p-3 rounded mb-3 border" id="adminShopSelector">
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">県</label>
                                    <select class="form-select form-select-sm" id="filterPref" onchange="onPrefChange()">
                                        <option value="">すべての県</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">地区</label>
                                    <select class="form-select form-select-sm" id="filterDistrict" onchange="onDistrictChange()">
                                        <option value="">すべての地区</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">取扱専売店（選択）</label>
                                    <select class="form-select form-select-sm border-primary" id="selectShop" required>
                                        <option value="">専売店を選択してください</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="alert alert-info py-2 mb-3" id="storeShopFixed" style="display: none;">
                            取扱専売店: <strong id="fixedShopName" class="fs-6">--</strong>
                            <span class="badge bg-secondary ms-2" id="fixedShopCode">--</span>
                        </div>

                        <div class="section-header">② 【エンドユーザー様情報】（新聞読者）</div>
                        <div class="bg-light p-3 rounded mb-3 border row g-3">
                            <div class="col-md-3"><label class="small fw-bold">フリガナ</label><input type="text" class="form-control form-control-sm" id="custKana"></div>
                            <div class="col-md-3"><label class="small fw-bold">お名前(フルネーム)</label><input type="text" class="form-control form-control-sm" id="custName" required></div>
                            <div class="col-md-3"><label class="small fw-bold">自宅電話</label><input type="text" class="form-control form-control-sm" id="custTel"></div>
                            <div class="col-md-3"><label class="small fw-bold">携帯電話</label><input type="text" class="form-control form-control-sm" id="custMobile"></div>
                            <div class="col-md-2"><label class="small fw-bold">郵便番号</label><input type="text" class="form-control form-control-sm" id="custZip"></div>
                            <div class="col-md-10"><label class="small fw-bold">ご住所(建物名必須)</label><input type="text" class="form-control form-control-sm" id="custAddress" required></div>
                        </div>

                        <div class="section-header">③ 手配内容・配達先状況・配達希望日時</div>
                        <div class="bg-light p-3 rounded mb-3 border row g-3">
                            <div class="col-md-6">
                                <label class="small fw-bold">手配内容</label>
                                <select class="form-select form-select-sm" id="deliveryType" required>
                                    <option value="2">②エディオン配達センターでお客様宅へ配達</option>
                                    <option value="1">①加盟店様に納品</option>
                                    <option value="3">③エディオン店舗受取</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="small fw-bold">階段手上げ</label>
                                <select class="form-select form-select-sm" id="stairFloor">
                                    <option value="">階段なし(EVあり/1階)</option>
                                    <option value="2">2階 (+1,100円)</option><option value="3">3階 (+1,100円)</option>
                                    <option value="4">4階 (+2,200円)</option><option value="5">5階 (+2,200円)</option>
                                    <option value="内階段">内階段(要見積)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="small fw-bold">第一希望</label>
                                <div class="input-group input-group-sm">
                                    <input type="date" class="form-control" id="deliveryDate1">
                                    <select class="form-select" id="deliveryTime1"><option value="指定なし">指定なし</option><option value="午前">午前</option><option value="午後">午後</option><option value="夕方">夕方</option></select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="small fw-bold">第二希望</label>
                                <div class="input-group input-group-sm">
                                    <input type="date" class="form-control" id="deliveryDate2">
                                    <select class="form-select" id="deliveryTime2"><option value="指定なし">指定なし</option><option value="午前">午前</option><option value="午後">午後</option><option value="夕方">夕方</option></select>
                                </div>
                            </div>
                        </div>

                        <div class="section-header">④ 発注商品・価格設定</div>
                        <div class="bg-light p-3 rounded mb-3 border row g-3">
                            <div class="col-md-3"><label class="small fw-bold">メーカー</label><input type="text" class="form-control form-control-sm" id="makerName" required></div>
                            <div class="col-md-3"><label class="small fw-bold">商品名</label><input type="text" class="form-control form-control-sm" id="prodName" required></div>
                            <div class="col-md-3"><label class="small fw-bold">型番</label><input type="text" class="form-control form-control-sm" id="prodModel" required></div>
                            <div class="col-md-1"><label class="small fw-bold">色</label><input type="text" class="form-control form-control-sm" id="prodColor"></div>
                            <div class="col-md-1"><label class="small fw-bold">数量</label><input type="number" class="form-control form-control-sm" id="prodQty" value="1" required></div>
                            <div class="col-md-4"><label class="small fw-bold">卸価格(税込)</label><input type="number" class="form-control form-control-sm" id="wholesalePrice" required></div>
                            <div class="col-md-4"><label class="small fw-bold">配送料(税込)</label><input type="number" class="form-control form-control-sm" id="shippingFee" value="0"></div>
                            <div class="col-md-4"><label class="small fw-bold">リサイクル</label><select class="form-select form-select-sm" id="recycleSelect"><option value="無">無</option><option value="有">有(現金精算)</option></select></div>
                        </div>

                        <div class="section-header">⑤ カード決済情報・特記事項</div>
                        <div class="bg-light p-3 rounded mb-3 border row g-3">
                            <div class="col-md-6"><label class="small fw-bold">カードNO</label><input type="text" class="form-control form-control-sm" id="cardNo" placeholder="1234-5678-9012-3456"></div>
                            <div class="col-md-3"><label class="small fw-bold">有効期限(年)</label><input type="text" class="form-control form-control-sm" id="cardExpYear" placeholder="2028"></div>
                            <div class="col-md-3"><label class="small fw-bold">有効期限(月)</label><input type="text" class="form-control form-control-sm" id="cardExpMonth" placeholder="12"></div>
                            <div class="col-12"><label class="small fw-bold">連絡事項</label><textarea class="form-control form-control-sm" id="orderMemo" rows="2"></textarea></div>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-primary px-5" id="submitBtn">登録して保存</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="tab-pane fade" id="list-pane">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-primary mb-3">登録済 受注・発注履歴</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle small">
                            <thead class="table-light">
                                <tr>
                                    <th>登録日</th><th>発注専売店</th><th>顧客名</th><th>商品名</th><th>決済合計</th><th class="text-center">公式Excel出力</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade admin-only" id="master-pane">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-primary mb-3">登録済 専売店マスタ一覧 (全 1,163 店舗)</h5>
                    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                        <table class="table table-striped table-sm small">
                            <thead class="table-dark sticky-top">
                                <tr><th>コード</th><th>専売店名</th><th>県</th><th>地区</th><th>支部</th><th>班</th></tr>
                            </thead>
                            <tbody id="masterTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

", "group": "＊", "tel": ""}, {"code": "2", "name": "尾張地区", "pref": "愛知県", "district": "愛知県販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "3", "name": "三河地区", "pref": "愛知県", "district": "愛知県販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "4", "name": "三重販売部", "pref": "三重県", "district": "三重販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "5", "name": "岐阜販売部", "pref": "岐阜県", "district": "岐阜販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "6", "name": "福井県", "pref": "中部圏", "district": "中部圏販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "7", "name": "長野県", "pref": "中部圏", "district": "中部圏販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "8", "name": "滋賀県", "pref": "中部圏", "district": "中部圏販売部", "branch": "＊", "group": "＊", "tel": ""}, {"code": "9", "name": "東海販売部", "pref": "静岡県", "district": "東海販売部", "branch": "＊", "group": "＊", "tel": ""}];
    const EXCEL_B64 = "";

    let orders = [];
    let currentUser = null;

    document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const id = document.getElementById("loginId").value.trim();
        const pw = document.getElementById("loginPassword").value.trim();
        authenticate(id, pw);
    });

    function quickLogin(id, pw) {
        document.getElementById("loginId").value = id;
        document.getElementById("loginPassword").value = pw;
        authenticate(id, pw);
    }

    function authenticate(id, pw) {
        if (id === "admin" && pw === "admin123") {
            currentUser = { role: "admin", name: "中日新聞社 本部" };
            applyRoleUI();
            return;
        }
        const shop = SHOPS.find(s => String(s.code) === String(id));
        if (shop && pw === "shop123") {
            currentUser = { role: "store", shop: shop };
            applyRoleUI();
            return;
        }
        alert("IDまたはパスワードが正しくありません。\n【テスト用】\n管理者: admin / admin123\n専売店: " + SHOPS[0].code + " / shop123");
    }

    async function applyRoleUI() {
        document.getElementById("loginView").style.display = "none";
        document.getElementById("portalView").style.display = "block";

        const userDisp = document.getElementById("currentUserDisplay");
        const adminElements = document.querySelectorAll(".admin-only");

        if (currentUser.role === "admin") {
            userDisp.textContent = "管理者: " + currentUser.name;
            adminElements.forEach(el => el.style.display = "");
            document.getElementById("adminShopSelector").style.display = "block";
            document.getElementById("storeShopFixed").style.display = "none";
            initShopSelector();
            renderMasterTable();
        } else {
            userDisp.textContent = currentUser.shop.name;
            adminElements.forEach(el => el.style.display = "none");
            document.getElementById("adminShopSelector").style.display = "none";
            document.getElementById("storeShopFixed").style.display = "block";
            document.getElementById("fixedShopName").textContent = currentUser.shop.name;
            document.getElementById("fixedShopCode").textContent = currentUser.shop.code;
        }
        await loadOrdersFromSupabase();
    }

    function initShopSelector() {
        const prefSelect = document.getElementById("filterPref");
        const prefs = [...new Set(SHOPS.map(s => s.pref).filter(Boolean))];
        prefSelect.innerHTML = '<option value="">すべての県</option>';
        prefs.forEach(p => {
            const opt = document.createElement("option"); opt.value = p; opt.textContent = p;
            prefSelect.appendChild(opt);
        });
        updateShopList();
    }

    function onPrefChange() {
        const pref = document.getElementById("filterPref").value;
        const distSelect = document.getElementById("filterDistrict");
        distSelect.innerHTML = '<option value="">すべての地区</option>';
        const dists = [...new Set(SHOPS.filter(s => !pref || s.pref === pref).map(s => s.district).filter(Boolean))];
        dists.forEach(d => {
            const opt = document.createElement("option"); opt.value = d; opt.textContent = d;
            distSelect.appendChild(opt);
        });
        updateShopList();
    }

    function onDistrictChange() {
        updateShopList();
    }

    function updateShopList() {
        const pref = document.getElementById("filterPref").value;
        const dist = document.getElementById("filterDistrict").value;
        const shopSelect = document.getElementById("selectShop");
        shopSelect.innerHTML = '<option value="">専売店を選択してください</option>';

        const filtered = SHOPS.filter(s => (!pref || s.pref === pref) && (!dist || s.district === dist));
        filtered.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.code; opt.textContent = `${s.name} (${s.code})`;
            shopSelect.appendChild(opt);
        });
    }

    function renderMasterTable() {
        const tbody = document.getElementById("masterTableBody");
        tbody.innerHTML = SHOPS.map(s => `
            <tr>
                <td><strong>${s.code}</strong></td>
                <td>${s.name}</td>
                <td>${s.pref}</td>
                <td>${s.district}</td>
                <td>${s.branch}</td>
                <td>${s.group}</td>
            </tr>
        `).join("");
    }

    function logout() {
        currentUser = null;
        document.getElementById("loginForm").reset();
        document.getElementById("portalView").style.display = "none";
        document.getElementById("loginView").style.display = "block";
    }

    async function loadOrdersFromSupabase() {
        const tbody = document.getElementById("ordersTableBody");
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">読込中...</td></tr>';
        try {
            let query = supabaseClient.from("orders").select("*").order("created_at", { ascending: false });
            if (currentUser.role === "store") query = query.eq("shop_code", currentUser.shop.code);
            const { data, error } = await query;
            if (error) throw error;
            orders = data || [];
            renderOrders();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-danger">エラー: ${err.message}</td></tr>`;
        }
    }

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        document.getElementById("submitBtn").disabled = true;

        try {
            let targetShop = currentUser.role === "store" ? currentUser.shop : SHOPS.find(s => String(s.code) === String(document.getElementById("selectShop").value));
            if (!targetShop) {
                alert("取扱専売店を選択してください。");
                document.getElementById("submitBtn").disabled = false;
                return;
            }

            const expY = document.getElementById("cardExpYear").value.trim();
            const expM = document.getElementById("cardExpMonth").value.trim();
            
            const payload = {
                order_no: "ED-" + Date.now().toString().slice(-6),
                shop_code: targetShop.code, shop_name: targetShop.name,
                cust_kana: document.getElementById("custKana").value,
                cust_name: document.getElementById("custName").value,
                cust_tel: document.getElementById("custTel").value,
                cust_mobile: document.getElementById("custMobile").value,
                cust_zip: document.getElementById("custZip").value,
                cust_address: document.getElementById("custAddress").value,
                delivery_type: document.getElementById("deliveryType").value,
                stair_floor: document.getElementById("stairFloor").value,
                delivery_date_1: document.getElementById("deliveryDate1").value,
                delivery_time_1: document.getElementById("deliveryTime1").value,
                delivery_date_2: document.getElementById("deliveryDate2").value,
                delivery_time_2: document.getElementById("deliveryTime2").value,
                maker_name: document.getElementById("makerName").value,
                prod_name: document.getElementById("prodName").value,
                prod_model: document.getElementById("prodModel").value,
                prod_color: document.getElementById("prodColor").value,
                qty: parseInt(document.getElementById("prodQty").value) || 1,
                wholesale_price: parseFloat(document.getElementById("wholesalePrice").value) || 0,
                shipping_fee: parseFloat(document.getElementById("shippingFee").value) || 0,
                recycle_info: document.getElementById("recycleSelect").value,
                card_no: document.getElementById("cardNo").value,
                card_exp: (expY && expM) ? `${expY}年 ${expM}月` : "",
                memo: document.getElementById("orderMemo").value
            };

            await supabaseClient.from("orders").insert([payload]);
            alert("【保存成功】Supabaseに登録しました。一覧から公式Excelを出力できます。");
            document.getElementById("orderForm").reset();
            await loadOrdersFromSupabase();
            new bootstrap.Tab(document.getElementById("list-tab")).show();
        } catch (err) {
            alert("エラー: " + err.message);
        } finally {
            document.getElementById("submitBtn").disabled = false;
        }
    });

    function renderOrders() {
        const tbody = document.getElementById("ordersTableBody");
        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">データなし</td></tr>';
            return;
        }
        tbody.innerHTML = orders.map(o => {
            const date = o.created_at ? o.created_at.slice(0,10) : "";
            const total = (o.wholesale_price * o.qty) + o.shipping_fee;
            return `
                <tr>
                    <td>${date}<br><strong>${o.order_no}</strong></td>
                    <td>${o.shop_name}</td>
                    <td>${o.cust_name} 様</td>
                    <td>${o.prod_name}</td>
                    <td>¥${total.toLocaleString()}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-success fw-bold px-3 py-1" onclick="generateRealExcel('${o.order_no}')">
                            <i class="bi bi-file-excel"></i> 発注書を出力
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    async function generateRealExcel(orderNo) {
        const o = orders.find(x => x.order_no === orderNo);
        if(!o) return;

        alert("原本フォーマットのExcelファイルを生成します。\nダウンロード後、そのまま印刷してご利用ください。");

        const byteCharacters = atob(EXCEL_B64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);

        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(byteArray);
        const sheet = workbook.worksheets[0];

        const dateObj = o.created_at ? new Date(o.created_at) : new Date();
        sheet.getCell('B3').value = `${dateObj.getFullYear()}年 ${dateObj.getMonth()+1}月 ${dateObj.getDate()}日`;

        sheet.getCell('L11').value = o.cust_kana || "";
        sheet.getCell('L12').value = o.cust_name || "";
        sheet.getCell('AQ11').value = o.cust_tel || "";
        sheet.getCell('AQ13').value = o.cust_mobile || "";
        
        const zip = (o.cust_zip||"").replace(/[^0-9]/g, "");
        sheet.getCell('M16').value = zip.slice(0,3);
        sheet.getCell('R16').value = zip.slice(3,7);
        sheet.getCell('L18').value = o.cust_address || "";

        const dt = String(o.delivery_type);
        sheet.getCell('AJ22').value = dt === "1" ? '■① 加盟店様に納品' : '□① 加盟店様に納品';
        sheet.getCell('AJ23').value = dt === "2" ? '■② ｴﾃﾞｨｵﾝの配達ｾﾝﾀｰを利用してお客様宅へ配達（※配達設置料金が必要となります）' : '□② ｴﾃﾞｨｵﾝの配達ｾﾝﾀｰを利用してお客様宅へ配達（※配達設置料金が必要となります）';
        sheet.getCell('AJ24').value = dt === "3" ? '■③ ｴﾃﾞｨｵﾝ店舗での商品受取' : '□③ ｴﾃﾞｨｵﾝ店舗での商品受取';

        sheet.getCell('F23').value = `【 ${o.stair_floor || "  "} 】`;

        sheet.getCell('T26').value = o.delivery_date_1 || "";
        sheet.getCell('T27').value = o.delivery_time_1 || "";
        sheet.getCell('AQ26').value = o.delivery_date_2 || "";
        sheet.getCell('AQ27').value = o.delivery_time_2 || "";

        const qty = o.qty || 1;
        const wholesale = o.wholesale_price || 0;
        const shipping = o.shipping_fee || 0;
        sheet.getCell('B30').value = o.maker_name || "";
        sheet.getCell('G30').value = o.prod_name || "";
        sheet.getCell('L30').value = o.prod_model || "";
        sheet.getCell('AA30').value = o.prod_color || "";
        sheet.getCell('AD30').value = qty;
        sheet.getCell('AH30').value = wholesale;
        sheet.getCell('AT30').value = shipping;
        sheet.getCell('BC30').value = (o.recycle_info || "").includes("有") ? "【有】：無" : "有：【無】";

        sheet.getCell('AH38').value = wholesale * qty;
        sheet.getCell('AT38').value = shipping;

        sheet.getCell('M40').value = `【取扱専売店】中日新聞 ${o.shop_name}\n${o.memo || ""}`;

        sheet.getCell('J44').value = "ESC 中日新聞社";
        sheet.getCell('J45').value = "";
        sheet.getCell('AA44').value = "052-201-8811";
        sheet.getCell('AA45').value = "052-221-0780";
        sheet.getCell('AX44').value = "販売局事業開発部 久保中";
        sheet.getCell('AX45').value = "080-3501-9088";

        const total = (wholesale * qty) + shipping;
        sheet.getCell('S47').value = total;
        sheet.getCell('J49').value = o.card_no || "";
        
        const expStr = o.card_exp || "";
        if(expStr.includes("年")) {
            const parts = expStr.split("年");
            sheet.getCell('J51').value = parts[0].trim();
            sheet.getCell('P51').value = parts[1].replace("月","").trim();
        }

        workbook.xlsx.writeBuffer().then(buffer => {
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `EDION発注書_${orderNo}_${o.cust_name}.xlsx`;
            a.click();
            URL.revokeObjectURL(url);
        });
    }
</script>
